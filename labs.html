<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS · Chapter 2 · Labs & Exercises</title>
<style>
  :root { --bg:#0b1020; --card:#161e36; --ink:#eef2ff; --muted:#8b93b5; --acc:#22d3ee; --gold:#facc15; --ok:#22c55e; --bad:#ef4444; --pur:#a855f7; --line:#26305a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; background:radial-gradient(circle at top,#1e1b4b,var(--bg) 60%); color:var(--ink); min-height:100vh; line-height:1.5; }
  .top { position:sticky; top:0; z-index:10; background:#0b1020e6; backdrop-filter:blur(6px); padding:10px 18px; display:flex; align-items:center; gap:14px; }
  .top a { color:var(--acc); text-decoration:none; font-weight:700; white-space:nowrap; }
  .bar { flex:1; height:8px; background:#1e2746; border-radius:8px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),var(--pur)); transition:width .5s; }
  .pct { color:var(--gold); font-weight:800; white-space:nowrap; }
  main { max-width:760px; margin:0 auto; padding:28px 18px 60px; }
  h1 { margin:0 0 4px; font-size:2rem; background:linear-gradient(90deg,var(--acc),var(--pur)); -webkit-background-clip:text; color:transparent; }
  .sub { color:var(--muted); margin:0 0 22px; }
  h2 { font-size:1.1rem; color:var(--gold); margin:26px 0 10px; }
  .ex { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; transition:border-color .3s, transform .3s; animation:up .5s ease both; }
  @keyframes up { from { opacity:0; transform:translateY(16px); } }
  .ex.ok { border-color:var(--ok); }
  .ex.ok .t::after { content:" ✔"; color:var(--ok); }
  .t { font-weight:800; margin-bottom:4px; }
  .p { color:var(--ink); margin-bottom:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input { flex:1; min-width:200px; background:#020617; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:ui-monospace,Consolas,monospace; font-size:.95rem; }
  input:focus { outline:none; border-color:var(--acc); }
  .btn { background:linear-gradient(135deg,var(--acc),var(--pur)); color:#0b1020; border:0; border-radius:10px; padding:10px 16px; font-weight:800; cursor:pointer; }
  .btn.ghost { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  .btn:disabled { opacity:.4; cursor:default; }
  .fb { min-height:20px; margin-top:8px; font-weight:700; font-size:.92rem; }
  .fb.ok { color:var(--ok); } .fb.no { color:var(--bad); }
  .hint { color:var(--muted); font-size:.9rem; margin-top:6px; }
  .shake { animation:sh .4s; }
  @keyframes sh { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .done { text-align:center; padding:30px; display:none; }
  .done.show { display:block; }
  .done h2 { font-size:1.6rem; color:var(--gold); }
  code { font-family:ui-monospace,Consolas,monospace; color:var(--acc); }
</style>
</head>
<body>

<div class="top">
  <a href="index.html">← Home</a>
  <div class="bar"><i id="prog"></i></div>
  <span class="pct" id="pct">0 / 8</span>
</div>

<main>
  <h1>Labs & Exercises</h1>
  <p class="sub">Type the command or answer. Use the hint if stuck.</p>

  <h2>Part A · Commands</h2>
  <div id="cmdEx"></div>

  <h2>Part B · Concepts</h2>
  <div id="conEx"></div>

  <div class="done" id="done">
    <h2>🏆 Lab complete!</h2>
    <p>All 8 exercises solved. Ready for the game?</p>
    <a class="btn" href="game.html" style="text-decoration:none;display:inline-block;margin-top:8px">🎮 Play the game</a>
  </div>
</main>

<script>
const commandEx = [
  { t: "Kernel version", p: "Show the Linux kernel version and system details.", a: ["uname -a", "uname -r"], h: "Use the 'uname' command." },
  { t: "Current user", p: "Show the name of the user you are logged in as.", a: ["whoami"], h: "Five letters. Who am I?" },
  { t: "Current folder", p: "Print the full path of the folder you are in.", a: ["pwd"], h: "Print Working Directory." },
  { t: "Distribution", p: "Show which Linux distribution is installed.", a: ["cat /etc/os-release"], h: "Read the file /etc/os-release." },
  { t: "Create a folder", p: "Create a folder named demo.", a: ["mkdir demo"], h: "Make directory." },
  { t: "List files", p: "List files in long format with permissions and sizes.", a: ["ls -l", "ls -la", "ls -al"], h: "List, with the long option." }
];
const conceptEx = [
  { t: "Core of the OS", p: "The ____ manages the CPU, memory and devices.", a: ["kernel"], h: "The core, in one word." },
  { t: "Gateway", p: "Applications ask the kernel for help using ____ calls.", a: ["system"], h: "Starts with 'sys'." }
];

const total = commandEx.length + conceptEx.length;
let solved = 0;
const norm = s => s.trim().toLowerCase().replace(/\s+/g, " ");

function build(list, host, isCmd) {
  list.forEach((ex, i) => {
    const d = document.createElement("div");
    d.className = "ex";
    d.style.animationDelay = (i * 0.08) + "s";
    d.innerHTML =
      '<div class="t">' + (i + 1) + ". " + ex.t + '</div>' +
      '<div class="p">' + ex.p + '</div>' +
      '<div class="row"><input placeholder="' + (isCmd ? "type the command..." : "type the word...") + '">' +
      '<button class="btn">Check</button><button class="btn ghost">Hint</button></div>' +
      '<div class="fb"></div><div class="hint" style="display:none"></div>';
    const input = d.querySelector("input");
    const fb = d.querySelector(".fb");
    const hintEl = d.querySelector(".hint");
    const [checkBtn, hintBtn] = d.querySelectorAll("button");
    hintEl.textContent = "💡 " + ex.h;
    let isDone = false;

    function check() {
      if (isDone) return;
      const v = norm(input.value);
      if (!v) return;
      if (ex.a.map(norm).includes(v)) {
        isDone = true;
        d.classList.add("ok");
        fb.className = "fb ok";
        fb.textContent = "✔ Correct!";
        input.disabled = true;
        checkBtn.disabled = true;
        solved++; update();
      } else {
        fb.className = "fb no";
        fb.textContent = "✘ Not quite, try again.";
        d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      }
    }
    checkBtn.onclick = check;
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    hintBtn.onclick = () => { hintEl.style.display = "block"; };
    host.appendChild(d);
  });
}
build(commandEx, document.getElementById("cmdEx"), true);
build(conceptEx, document.getElementById("conEx"), false);

function update() {
  document.getElementById("pct").textContent = solved + " / " + total;
  document.getElementById("prog").style.width = (solved / total * 100) + "%";
  if (solved === total) document.getElementById("done").classList.add("show");
}
</script>
</body>
</html>
