<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux Quest · OS Chapter 2</title>
<style>
  :root { --bg:#0b1020; --card:#161e36; --ink:#eef2ff; --muted:#8b93b5; --acc:#22d3ee; --gold:#facc15; --ok:#22c55e; --bad:#ef4444; --pur:#a855f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI",Roboto,sans-serif; background:radial-gradient(circle at top,#1e1b4b,var(--bg) 60%); color:var(--ink); min-height:100vh; overflow-x:hidden; }
  .hud { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:12px 18px; background:#0b1020cc; backdrop-filter:blur(6px); }
  .hud .xp { color:var(--gold); font-weight:800; min-width:70px; }
  .bar { flex:1; height:10px; background:#1e2746; border-radius:10px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--acc),var(--pur)); transition:width .6s; }
  .hearts { font-size:1.1rem; letter-spacing:2px; }
  main { max-width:760px; margin:0 auto; padding:24px 18px 60px; min-height:calc(100vh - 60px); }
  .scene { display:none; text-align:center; }
  .scene.on { display:block; animation:in .6s ease; }
  @keyframes in { from { opacity:0; transform:translateY(30px) scale(.98); } }
  h1 { font-size:clamp(2.2rem,7vw,3.6rem); margin:30px 0 6px; background:linear-gradient(90deg,var(--acc),var(--pur),var(--gold)); -webkit-background-clip:text; color:transparent; animation:glow 2.5s ease-in-out infinite alternate; }
  @keyframes glow { from { filter:drop-shadow(0 0 4px #22d3ee55); } to { filter:drop-shadow(0 0 18px #a855f788); } }
  h2 { font-size:1.6rem; margin:6px 0 16px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .btn { background:linear-gradient(135deg,var(--acc),var(--pur)); color:#0b1020; border:0; border-radius:14px; padding:14px 30px; font-size:1.05rem; font-weight:800; cursor:pointer; box-shadow:0 8px 24px #22d3ee44; transition:transform .15s; }
  .btn:hover:not(:disabled) { transform:translateY(-2px) scale(1.04); }
  .btn:disabled { opacity:.35; cursor:default; box-shadow:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
  .tile { background:var(--card); border:2px solid #26305a; border-radius:16px; padding:18px 10px; cursor:pointer; transition:transform .6s, background .4s, border-color .4s; }
  .tile:hover { border-color:var(--acc); transform:translateY(-4px); }
  .tile .yr { font-size:1.5rem; font-weight:900; color:var(--gold); }
  .tile .nm { font-size:.9rem; color:var(--muted); }
  .tile.done { background:#14532d; border-color:var(--ok); transform:rotateY(360deg); }
  .stack { position:relative; max-width:420px; margin:0 auto 20px; padding-left:60px; text-align:left; }
  .lay { background:var(--card); border:2px solid #26305a; border-radius:12px; padding:14px 16px; margin-bottom:10px; font-weight:700; transition:all .35s; }
  .lay.hot { border-color:var(--gold); box-shadow:0 0 22px #facc1566; transform:scale(1.03); }
  .ball { position:absolute; left:14px; top:0; width:26px; height:26px; border-radius:50%; background:var(--gold); box-shadow:0 0 16px var(--gold); transition:top .7s ease; }
  .pairs { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:560px; margin:0 auto 20px; }
  .pill { background:var(--card); border:2px solid #26305a; border-radius:12px; padding:14px; cursor:pointer; font-weight:700; color:var(--ink); font-size:.95rem; transition:all .25s; }
  .pill.sel { border-color:var(--acc); background:#0e3a48; }
  .pill.ok { border-color:var(--ok); background:#14532d; cursor:default; }
  .pill.no { animation:shake .4s; border-color:var(--bad); }
  .pill code { font-family:ui-monospace,Consolas,monospace; color:var(--acc); }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .q { font-size:1.3rem; font-weight:800; margin:10px 0 20px; min-height:3em; }
  .ans { display:grid; gap:10px; max-width:520px; margin:0 auto 16px; }
  .ans button { background:var(--card); color:var(--ink); border:2px solid #26305a; border-radius:12px; padding:14px; font-size:1rem; cursor:pointer; transition:transform .15s; }
  .ans button:hover:not(:disabled) { transform:scale(1.02); border-color:var(--acc); }
  .ans button.ok { background:#14532d; border-color:var(--ok); }
  .ans button.no { background:#7f1d1d; border-color:var(--bad); }
  .badge { font-size:5rem; animation:pop .8s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(0) rotate(-180deg); } }
  .conf { position:fixed; top:-20px; width:9px; height:14px; z-index:50; pointer-events:none; animation:fall 2.6s linear forwards; }
  @keyframes fall { to { transform:translateY(110vh) rotate(900deg); } }
  .big { font-size:2.4rem; font-weight:900; color:var(--gold); }
  .fl { font-size:1.4rem; font-weight:800; min-height:1.6em; margin:10px 0; }
  @media (max-width:500px){ .pairs{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="hud">
  <span class="xp">⭐ <b id="xp">0</b> XP</span>
  <div class="bar"><i id="prog"></i></div>
  <span class="hearts" id="hearts">❤️❤️❤️</span>
</div>

<main>

  <!-- START -->
  <section class="scene on" id="s0">
    <h1>LINUX QUEST</h1>
    <p class="sub">OS · Chapter 2</p>
    <button class="btn" onclick="go(1)">▶ START</button>
  </section>

  <!-- LEVEL 1: TIMELINE -->
  <section class="scene" id="s1">
    <h2>🕰️ Level 1 · Timeline</h2>
    <p class="sub">Tap each event to unlock it</p>
    <div class="grid" id="tiles"></div>
    <button class="btn" id="n1" disabled onclick="go(2)">NEXT →</button>
  </section>

  <!-- LEVEL 2: LAYERS -->
  <section class="scene" id="s2">
    <h2>🧱 Level 2 · Layers</h2>
    <p class="sub">Watch the command travel down</p>
    <div class="stack" id="stack">
      <div class="ball" id="ball"></div>
      <div class="lay">👤 Your program</div>
      <div class="lay">📚 glibc</div>
      <div class="lay">🔌 System call</div>
      <div class="lay">🧠 Kernel</div>
      <div class="lay">🔩 Hardware</div>
    </div>
    <button class="btn" id="play" onclick="playLayers()">▶ PLAY</button>
    <p class="fl" id="fl2"></p>
    <button class="btn" id="n2" disabled onclick="go(3)">NEXT →</button>
  </section>

  <!-- LEVEL 3: MATCH -->
  <section class="scene" id="s3">
    <h2>⌨️ Level 3 · Match</h2>
    <p class="sub">Match the command to its job</p>
    <div class="pairs" id="pairs"></div>
    <p class="fl" id="fl3"></p>
    <button class="btn" id="n3" disabled onclick="go(4)">NEXT →</button>
  </section>

  <!-- LEVEL 4: BOSS QUIZ -->
  <section class="scene" id="s4">
    <h2>🐉 Level 4 · Boss Quiz</h2>
    <p class="sub" id="qnum"></p>
    <div class="q" id="qtext"></div>
    <div class="ans" id="ans"></div>
    <p class="fl" id="fl4"></p>
  </section>

  <!-- WIN -->
  <section class="scene" id="s5">
    <div class="badge">🏆</div>
    <h1 style="font-size:2.4rem">LINUX MASTER</h1>
    <p class="big" id="final"></p>
    <button class="btn" onclick="restart()">↻ PLAY AGAIN</button>
  </section>

</main>

<script>
let xp = 0, lives = 3, scene = 0;
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const SCENES = 4;

function addXp(n) { xp += n; $("xp").textContent = xp; }
function setProg(done) { $("prog").style.width = (done / SCENES * 100) + "%"; }
function renderHearts() { $("hearts").textContent = "❤️".repeat(lives) + "🖤".repeat(3 - lives); }

function confetti() {
  const cols = ["#22d3ee","#a855f7","#facc15","#22c55e","#ef4444"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div");
    c.className = "conf";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = cols[i % cols.length];
    c.style.animationDelay = Math.random() * .6 + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

function go(n) {
  document.querySelectorAll(".scene").forEach(s => s.classList.remove("on"));
  $("s" + n).classList.add("on");
  scene = n;
  setProg(Math.min(n - 1, SCENES));
  if (n === 4) startQuiz();
  if (n === 5) { $("final").textContent = xp + " XP · " + lives + " ❤️ left"; confetti(); }
}

/* LEVEL 1 */
const events = [
  { y: "1969", n: "UNIX" }, { y: "1983", n: "GNU" }, { y: "1991", n: "Linux kernel" },
  { y: "1993", n: "Debian" }, { y: "2004", n: "Ubuntu" }, { y: "2008", n: "Android" }
];
let found = 0;
events.forEach(e => {
  const t = document.createElement("div");
  t.className = "tile";
  t.innerHTML = '<div class="yr">' + e.y + '</div><div class="nm">' + e.n + '</div>';
  t.onclick = () => {
    if (t.classList.contains("done")) return;
    t.classList.add("done");
    addXp(10); found++;
    if (found === events.length) { $("n1").disabled = false; confetti(); }
  };
  $("tiles").appendChild(t);
});

/* LEVEL 2 */
let layersDone = false;
async function playLayers() {
  $("play").disabled = true;
  const lays = document.querySelectorAll(".lay");
  const ball = $("ball");
  for (let i = 0; i < lays.length; i++) {
    lays.forEach(l => l.classList.remove("hot"));
    lays[i].classList.add("hot");
    ball.style.top = lays[i].offsetTop + lays[i].offsetHeight / 2 - 13 + "px";
    await sleep(700);
  }
  lays.forEach(l => l.classList.remove("hot"));
  $("fl2").textContent = "⚡ Data reached the hardware!";
  if (!layersDone) { addXp(20); layersDone = true; }
  $("n2").disabled = false;
  $("play").disabled = false;
}

/* LEVEL 3 */
const pairData = [
  { c: "<code>pwd</code>", a: "Current folder" },
  { c: "<code>ls -l</code>", a: "List files" },
  { c: "<code>whoami</code>", a: "Current user" },
  { c: "<code>cat /etc/os-release</code>", a: "Distro info" }
];
let selCmd = null, matched = 0;
const shuffle = a => a.sort(() => Math.random() - .5);
const leftItems = shuffle([...pairData]);
const rightItems = shuffle([...pairData]);
leftItems.forEach(p => {
  const b = document.createElement("div");
  b.className = "pill"; b.innerHTML = p.c; b.dataset.key = p.a;
  b.onclick = () => {
    if (b.classList.contains("ok")) return;
    document.querySelectorAll("#pairs .pill.sel").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); selCmd = b;
  };
  $("pairs").appendChild(b);
});
rightItems.forEach(p => {
  const b = document.createElement("div");
  b.className = "pill"; b.textContent = p.a; b.dataset.key = p.a;
  b.onclick = () => {
    if (!selCmd || b.classList.contains("ok")) return;
    if (selCmd.dataset.key === b.dataset.key) {
      selCmd.classList.remove("sel"); selCmd.classList.add("ok");
      b.classList.add("ok");
      addXp(10); matched++;
      $("fl3").textContent = "✔ Nice!";
      if (matched === pairData.length) { $("n3").disabled = false; $("fl3").textContent = "🎯 All matched!"; confetti(); }
      selCmd = null;
    } else {
      b.classList.add("no");
      const s = selCmd;
      setTimeout(() => b.classList.remove("no"), 400);
      $("fl3").textContent = "✘ Try again";
    }
  };
  $("pairs").appendChild(b);
});

/* LEVEL 4 */
const quiz = [
  { q: "Who started GNU?", o: ["Linus Torvalds", "Richard Stallman", "Ken Thompson"], a: 1 },
  { q: "Linux is…", o: ["The shell", "The kernel", "A window"], a: 1 },
  { q: "What lets apps ask the kernel for help?", o: ["Hardware", "System call", "Terminal"], a: 1 },
  { q: "The shell is…", o: ["A program that reads your commands", "The screen", "A disk"], a: 0 },
  { q: "glibc belongs to…", o: ["System libraries", "Hardware", "Users"], a: 0 }
];
let qi = 0, locked = false;
function startQuiz() { qi = 0; lives = 3; renderHearts(); showQ(); }
function showQ() {
  const item = quiz[qi];
  $("qnum").textContent = "Question " + (qi + 1) + " / " + quiz.length;
  $("qtext").textContent = item.q;
  $("fl4").textContent = "";
  const box = $("ans");
  box.innerHTML = "";
  item.o.forEach((t, i) => {
    const b = document.createElement("button");
    b.textContent = t;
    b.onclick = () => answer(i, b);
    box.appendChild(b);
  });
  locked = false;
}
async function answer(i, btn) {
  if (locked) return;
  locked = true;
  const item = quiz[qi];
  const btns = $("ans").children;
  if (i === item.a) {
    btn.classList.add("ok"); addXp(15);
    $("fl4").textContent = "✔ Correct!";
  } else {
    btn.classList.add("no"); lives--; renderHearts();
    btns[item.a].classList.add("ok");
    $("fl4").textContent = "✘ Oops";
  }
  await sleep(1100);
  if (lives === 0) { $("fl4").textContent = "💀 Game over. Try again!"; await sleep(1200); restart(true); return; }
  qi++;
  if (qi < quiz.length) showQ();
  else go(5);
}

function restart() { location.reload(); }
renderHearts();
</script>
</body>
</html>
