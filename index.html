<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS · Chapter 2 · Linux System Overview</title>
<style>
  :root { --bg:#0b1020; --card:#161e36; --ink:#eef2ff; --muted:#8b93b5; --acc:#22d3ee; --gold:#facc15; --pur:#a855f7; --line:#26305a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:system-ui,"Segoe UI",Roboto,sans-serif; background:radial-gradient(circle at top,#1e1b4b,var(--bg) 60%); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:720px; text-align:center; animation:in .7s ease; }
  @keyframes in { from { opacity:0; transform:translateY(20px); } }
  .tag { color:var(--gold); letter-spacing:2px; font-size:.85rem; font-weight:700; }
  h1 { font-size:clamp(2rem,6vw,3rem); margin:8px 0 6px; background:linear-gradient(90deg,var(--acc),var(--pur),var(--gold)); -webkit-background-clip:text; color:transparent; animation:glow 2.5s ease-in-out infinite alternate; }
  @keyframes glow { from { filter:drop-shadow(0 0 4px #22d3ee55); } to { filter:drop-shadow(0 0 16px #a855f788); } }
  .sub { color:var(--muted); margin:0 0 36px; }
  .menu { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:30px 22px; text-decoration:none; color:var(--ink); transition:transform .25s, border-color .25s, box-shadow .25s; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .card:hover { transform:translateY(-6px); border-color:var(--acc); box-shadow:0 14px 34px #22d3ee33; }
  .icon { font-size:3rem; animation:bob 2.6s ease-in-out infinite; }
  .card:nth-child(2) .icon { animation-delay:.4s; }
  @keyframes bob { 50% { transform:translateY(-6px); } }
  .card h2 { margin:0; font-size:1.35rem; }
  .card p { margin:0; color:var(--muted); font-size:.92rem; }
  .btn { margin-top:10px; background:linear-gradient(135deg,var(--acc),var(--pur)); color:#0b1020; border-radius:12px; padding:10px 20px; font-weight:800; }
  .game { display:inline-block; margin-top:34px; color:var(--acc); text-decoration:none; font-weight:700; border:1px solid var(--acc); border-radius:12px; padding:8px 18px; }
  .game:hover { background:var(--acc); color:#0b1020; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tag">OS 1 · CHAPTER 2</div>

        <h2>Explanation</h2>

        <span class="btn">Open</span>
      </a>

      <a class="card" href="labs.html">
        <div class="icon">🧪</div>
        <h2>Labs & Exercises</h2>
        <p>Practice commands and concepts with instant checks.</p>
        <span class="btn">Start</span>
      </a>
    </div>

    <a class="game" href="game.html">🎮 Play the game</a>
  </div>
</body>
</html>
